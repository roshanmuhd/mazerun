<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maze Run · Schesir & Pro Nutrition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F2EE;--ink:#262C2B;--mute:#6B726F;--acc:#2F6F66;--acc2:#D8B879;--wall:#404444;--card:#fff;--line:#E1DFD8;
--disp:'Montserrat',system-ui,sans-serif;--body:'Poppins',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-brand="pro"]{--bg:#F5F3EE;--ink:#143248;--mute:#5F7384;--acc:#F36251;--acc2:#82B0E2;--wall:#143248;--line:#E3DED3}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);transition:background .4s}
.screen{display:none;min-height:100%;padding:24px 20px;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
h1,h2{font-family:var(--disp);font-weight:800;line-height:1.04;letter-spacing:-.03em}
h2{font-size:clamp(30px,7vw,44px)}
.lead{color:var(--mute);max-width:40ch;margin-top:12px}
.lg img{display:block;height:38px;width:auto;max-width:200px}
/* landing */
#pick{padding:clamp(28px,6vh,64px) 22px;gap:clamp(28px,5vh,52px)}
.top{text-align:center;max-width:720px}
.top small{font:700 14px var(--disp);color:var(--mute);letter-spacing:.02em}
.top h1{font-size:clamp(40px,7.5vw,76px);margin:14px 0 16px}
.top p{color:var(--mute);font-size:clamp(16px,2vw,18px);max-width:46ch;margin:0 auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:820px}
.bc{background:#fff;border:1.5px solid transparent;border-radius:28px;padding:34px 32px 30px;text-align:left;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:30px;font-family:var(--body);color:#262C2B;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s;box-shadow:0 1px 2px rgba(20,30,28,.06),0 12px 32px -18px rgba(20,30,28,.25)}
.bc.s{--a:#2F6F66}.bc.p{--a:#F36251}
.bc .lg img{height:46px;max-width:230px}
.bc .go{margin-top:auto;display:inline-flex;align-items:center;gap:10px;font:600 15px var(--body);padding:13px 24px;border-radius:999px;background:var(--a);color:#fff;transition:gap .25s}
.bc .tx{font-size:15px;color:#66706c}
.bc:hover,.bc:focus-visible{transform:translateY(-4px);border-color:var(--a);outline:none;box-shadow:0 2px 4px rgba(20,30,28,.06),0 24px 44px -20px rgba(20,30,28,.35)}
.bc:hover .go{gap:16px}
.note{font-size:13.5px;color:var(--mute);text-align:center}
@media(max-width:720px){.cards{grid-template-columns:1fr}.bc{padding:26px 24px;gap:20px;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}.bc .tx{display:none}.bc .go{margin:0}}
/* form */
.panel{width:100%;max-width:420px;display:flex;flex-direction:column}
form{margin-top:28px;display:flex;flex-direction:column;gap:18px}
label{font-size:13px;font-weight:500;color:var(--mute);display:block;margin-bottom:4px}
input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);font:500 17px var(--body);padding:14px 16px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.err{color:#d2432b;font-size:13px;min-height:18px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;font:600 16px var(--body);padding:16px 28px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.link:focus-visible,.bc:focus-visible,.mini:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.link{background:none;border:0;color:var(--mute);font:500 14px var(--body);cursor:pointer;margin-top:16px;align-self:flex-start;text-decoration:underline;text-underline-offset:4px}
.rules{margin-top:20px;font-size:14px;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
/* game */
#game{justify-content:flex-start;gap:12px;padding-top:14px}
.hud{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 14px 10px 18px}
.hud .lg img{height:28px}
.who{font-size:13px;color:var(--mute);margin-top:4px}
.tr{position:relative;width:58px;height:58px;flex:none}
.tr svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr circle{fill:none;stroke-width:6;stroke-linecap:round}
.tr .bg{stroke:var(--line)}.tr .fg{stroke:var(--acc);transition:stroke-dashoffset .25s linear}
.tr b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px var(--disp);font-variant-numeric:tabular-nums}
.tr.low .fg{stroke:#d2432b}.tr.low b{color:#d2432b}
.wrap{width:100%;max-width:min(480px,calc((100dvh - 190px) * 9 / 11.4));background:#fff;border-radius:26px;padding:10px;border:1px solid var(--line);position:relative;box-shadow:0 24px 50px -26px rgba(20,30,28,.45)}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.cd{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.92);border-radius:26px;font:800 110px var(--disp);color:var(--acc);z-index:2}
.cd.off{display:none}
.foot{width:100%;max-width:480px;display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;transition:width .15s}
.mini{background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:999px;font:600 13px var(--body);padding:8px 16px;cursor:pointer}
/* result */
.res{align-items:flex-start}
.code{margin:24px 0 8px;border:2px dashed var(--acc);border-radius:18px;padding:18px 26px;font:700 26px var(--disp);letter-spacing:.12em;color:var(--acc);width:100%;text-align:center;background:color-mix(in srgb,var(--acc) 7%,transparent)}
.stat{color:var(--mute);font-size:15px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}

/* ===== v2 polish ===== */
html{-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);pointer-events:none;transition:background .5s}
body::before{width:440px;height:440px;left:-140px;top:-120px;background:color-mix(in srgb,var(--acc) 20%,transparent)}
body::after{width:400px;height:400px;right:-140px;bottom:-120px;background:color-mix(in srgb,var(--acc2) 32%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.screen.on>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.screen.on>*:nth-child(2){animation-delay:.07s}.screen.on>*:nth-child(3){animation-delay:.14s}.screen.on>*:nth-child(4){animation-delay:.2s}
#pick.on .bc:nth-child(1){animation:rise .6s .12s cubic-bezier(.2,.7,.2,1) backwards}
#pick.on .bc:nth-child(2){animation:rise .6s .24s cubic-bezier(.2,.7,.2,1) backwards}
.panel.on>*,.panel>*{animation:none}
#intro.on .panel>*,#win.on .panel>*,#lose.on .panel>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
#intro.on .panel>*:nth-child(2),#win.on .panel>*:nth-child(2),#lose.on .panel>*:nth-child(2){animation-delay:.06s}
#intro.on .panel>*:nth-child(3),#win.on .panel>*:nth-child(3),#lose.on .panel>*:nth-child(3){animation-delay:.12s}
#intro.on .panel>*:nth-child(4),#win.on .panel>*:nth-child(4),#lose.on .panel>*:nth-child(4){animation-delay:.18s}
#intro.on .panel>*:nth-child(5),#win.on .panel>*:nth-child(5),#lose.on .panel>*:nth-child(5){animation-delay:.24s}
#intro.on .panel>*:nth-child(6),#win.on .panel>*:nth-child(6),#lose.on .panel>*:nth-child(6){animation-delay:.3s}
.top small{display:inline-block;padding:6px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px -10px rgba(20,30,28,.35)}
/* mascots */
.mascot{display:block;width:132px;height:84px;flex:none;pointer-events:none}
.mascot.big{width:150px;height:110px}
.introtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.introtop .mascot{width:112px;height:72px}
.hero{display:flex;align-items:flex-end;gap:10px;margin-top:20px}
.hero img{height:112px;width:auto;animation:float 3.2s ease-in-out infinite}
.hero img:not([src]){display:none}
/* landing cards */
.bc{position:relative;overflow:hidden}
.bc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--a) 16%,transparent),transparent 62%);opacity:0;transition:opacity .35s;pointer-events:none}
.bc:hover::before,.bc:focus-visible::before{opacity:1}
.bc>*{position:relative}
.bc .lg img{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.bc:hover .lg img,.bc:focus-visible .lg img{transform:scale(1.06) translateX(3px)}
.bc .go{box-shadow:0 10px 20px -10px var(--a);transition:gap .25s,box-shadow .25s,filter .25s}
.bc:hover .go,.bc:focus-visible .go{box-shadow:0 16px 26px -10px var(--a);filter:saturate(1.15)}
.bc .go i{font-style:normal;display:inline-block;transition:transform .25s}
.bc:hover .go i{transform:translateX(2px)}
.bc:active{transform:translateY(-1px) scale(.992)}
@media(max-width:720px){.mascot{width:76px;height:50px}.bc .lg img{height:34px}.bc{gap:12px;flex-wrap:nowrap}.bc .go{padding:11px 18px}}
/* buttons + fields */
.btn{position:relative;overflow:hidden;box-shadow:0 12px 24px -12px var(--acc);transition:transform .2s,box-shadow .25s,filter .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%);transition:transform .7s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 30px -12px var(--acc);filter:saturate(1.12)}
.btn:hover::after{transform:translateX(130%)}
.btn:active{transform:scale(.97)}
.link{transition:color .2s,transform .2s}
.link:hover{color:var(--acc);transform:translateX(3px)}
input:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
form>div:focus-within label{color:var(--acc)}
label{transition:color .2s}
form.shake{animation:shake .4s}
.err:not(:empty){background:#fdecea;border-radius:10px;padding:8px 12px;min-height:0}
.mini{transition:transform .2s,border-color .2s,color .2s,box-shadow .2s}
.mini:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px);box-shadow:0 8px 16px -10px var(--acc)}
.mini:active{transform:scale(.96)}
/* game */
#game{user-select:none;-webkit-user-select:none}
.hud{box-shadow:0 10px 24px -18px rgba(20,30,28,.45);transition:box-shadow .3s,transform .3s}
.hud:hover{box-shadow:0 16px 30px -16px rgba(20,30,28,.5);transform:translateY(-1px)}
.tr.low{animation:beat .7s ease-in-out infinite}
.wrap{max-width:min(480px,calc((100dvh - 215px) * 10 / 13.2));transition:box-shadow .3s}
.wrap:hover{box-shadow:0 30px 56px -26px rgba(20,30,28,.55)}
canvas#cv{cursor:grab}canvas#cv.drag{cursor:grabbing}
.cd span{display:inline-block}
.hint{font-size:13px;color:var(--mute);text-align:center;min-height:20px;transition:opacity .5s,transform .5s}
.hint.off{opacity:0;transform:translateY(-4px)}
.prog i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.cd{background:rgba(255,255,255,.72)}
</style>
</head>
<body>

<section id="pick" class="screen on">
  <div class="top">
    <small>Maze Run</small>
    <h1>Draw your way to a prize.</h1>
    <p>Guide your pet through the maze in just 25 seconds. Every finisher wins.</p>
  </div>
  <div class="cards">
    <button class="bc s" data-b="schesir"><canvas class="mascot" data-b="schesir"></canvas><span class="lg" data-b="schesir"></span><span class="tx">Guide the line to the bowl.</span><span class="go">Play <i>&rarr;</i></span></button>
    <button class="bc p" data-b="pro"><canvas class="mascot" data-b="pro"></canvas><span class="lg" data-b="pro"></span><span class="tx">Beat the clock to the finish.</span><span class="go">Play <i>&rarr;</i></span></button>
  </div>
  <p class="note">25 seconds &middot; one maze &middot; a prize for every finisher</p>
</section>

<section id="intro" class="screen">
  <div class="panel">
    <div class="introtop"><div class="lg" id="lgI"></div><canvas class="mascot cur" data-mode="run"></canvas></div>
    <h2 id="ttl" style="margin-top:26px"></h2>
    <p class="lead" id="sub"></p>
    <form id="f" novalidate>
      <div><label for="n">Your name</label><input id="n" autocomplete="name" placeholder="Full name"></div>
      <div><label for="t">Phone number</label><input id="t" type="tel" autocomplete="tel" inputmode="tel" placeholder="+971 50 000 0000"></div>
      <div class="err" id="e" role="alert"></div>
      <button class="btn" type="submit">Start the maze</button>
    </form>
    <p class="rules" id="rl"></p>
    <button class="link" id="back">Change brand</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="hud"><div><div class="lg" id="lgG"></div><div class="who" id="who"></div></div>
    <div class="tr" id="tr"><svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="fg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><b id="tm">25</b></div></div>
  <div class="wrap"><canvas id="cv"></canvas><div class="cd off" id="cd3"><span id="cdt">3</span></div></div>
  <p class="hint" id="hint"></p>
  <div class="foot"><div class="prog"><i id="pg"></i></div><button class="mini" id="clr">Restart line</button></div>
</section>

<section id="win" class="screen">
  <div class="panel res">
    <div class="lg" id="lgW"></div>
    <div class="hero"><canvas class="mascot cur big" data-mode="jump"></canvas><img id="prodW" alt=""></div>
    <h2 style="margin-top:14px" id="wt"></h2>
    <p class="lead" id="ws"></p>
    <div class="code" id="cd"></div>
    <p class="stat" id="st"></p>
    <button class="btn" style="margin-top:24px" id="again">Play again</button>
    <button class="link" id="home">Finish</button>
  </div>
</section>

<section id="lose" class="screen">
  <div class="panel res">
    <div class="lg" id="lgL"></div>
    <div class="hero"><canvas class="mascot cur big" data-mode="sad"></canvas></div>
    <h2 style="margin-top:14px">Time's up</h2>
    <p class="lead">So close. A fresh maze is ready whenever you are.</p>
    <button class="btn" style="margin-top:24px" id="retry">Try a new maze</button>
    <button class="link" id="home2">Finish</button>
  </div>
</section>
<canvas id="conf"></canvas>

function gen1(){
 const g=[];for(let r=0;r<ROWS;r++){g[r]=[];for(let c=0;c<COLS;c++)g[r][c]={n:1,e:1,s:1,w:1,v:0}}
 const D=[[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']],st=[[0,0]];g[0][0].v=1;
 while(st.length){const[c,r]=st[st.length-1];
  const nb=D.map(d=>[c+d[0],r+d[1],d]).filter(([x,y])=>x>=0&&y>=0&&x<COLS&&y<ROWS&&!g[y][x].v);
  if(!nb.length){st.pop();continue}
  const[x,y,d]=nb[Math.random()*nb.length|0];g[r][c][d[2]]=0;g[y][x][d[3]]=0;g[y][x].v=1;st.push([x,y])}
 g[ROWS-1][COLS-1].s=0;return g}
function solveLen(g){
 const q=[[0,0]],d={'0,0':1};
 while(q.length){const[c,r]=q.shift(),k=g[r][c],L=d[c+','+r];
  if(c===COLS-1&&r===ROWS-1)return L;
  for(const[dc,dr,w]of[[0,-1,'n'],[1,0,'e'],[0,1,'s'],[-1,0,'w']]){if(k[w])continue;const x=c+dc,y=r+dr;if(x<0||y<0||x>=COLS||y>=ROWS||d[x+','+y])continue;d[x+','+y]=L+1;q.push([x,y])}}

function trailPath(){ctx.beginPath();ctx.moveTo(trail[0][0],trail[0][1]);for(let i=1;i<trail.length-1;i++){const a=trail[i],b=trail[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}const l=trail[trail.length-1];ctx.lineTo(l[0],l[1]);ctx.stroke()}
function drawPet(c,b,x,y,s,dir,ph,mv,ts,tilt){
 c.save();c.translate(x,y);c.scale(dir*s,s);if(tilt)c.rotate(tilt);
 const dog=b==='pro',bob=mv?-Math.abs(Math.sin(ph))*.05:Math.sin(ts/500)*.012;
 const body=dog?'#C98F55':'#404444',dark=dog?'#8A5A2B':'#2a2e2e';
 c.lineCap='round';c.lineJoin='round';
 c.fillStyle='rgba(0,0,0,.13)';c.beginPath();c.ellipse(-.02,.4,.42,.055,0,0,7);c.fill();
 const wag=Math.sin(mv?ph*2:ts/260)*(dog?.35:.18);
 c.strokeStyle=body;c.lineWidth=dog?.09:.075;c.beginPath();
 if(dog){c.moveTo(-.38,-.04+bob);c.quadraticCurveTo(-.55,-.1,-.5+wag*.4,-.34+wag*.15)}
 else{c.moveTo(-.38,bob);c.bezierCurveTo(-.62,.02,-.6+wag*.3,-.3,-.46+wag*.5,-.42)}
 c.stroke();
 const L=[[-.28,0,dark],[.2,Math.PI,dark],[-.2,Math.PI,body],[.28,0,body]];
 c.lineWidth=.085;
 for(const[lx,o,col]of L){const a=mv?Math.sin(ph+o)*.85:0;c.strokeStyle=col;c.beginPath();c.moveTo(lx,.1+bob);c.lineTo(lx+Math.sin(a)*.2,.1+bob+Math.cos(a)*.24);c.stroke()}
 c.fillStyle=body;c.beginPath();c.ellipse(-.04,bob,.4,dog?.2:.17,0,0,7);c.fill();
 if(dog){c.fillStyle='#F4E4CD';c.beginPath();c.ellipse(.17,.07+bob,.15,.11,0,0,7);c.fill()}
 const hx=.36,hy=-.13+bob;
 c.fillStyle=body;
 if(!dog){
  c.beginPath();c.moveTo(hx-.14,hy-.08);c.lineTo(hx-.1,hy-.31);c.lineTo(hx+.03,hy-.15);c.closePath();c.fill();
  c.beginPath();c.moveTo(hx+.02,hy-.15);c.lineTo(hx+.13,hy-.31);c.lineTo(hx+.16,hy-.06);c.closePath();c.fill()}
 c.beginPath();c.arc(hx,hy,.17,0,7);c.fill();
 if(dog){
  c.fillStyle='#F4E4CD';c.beginPath();c.ellipse(hx+.14,hy+.05,.12,.08,0,0,7);c.fill();
  c.fillStyle='#143248';c.beginPath();c.arc(hx+.245,hy+.02,.035,0,7);c.fill();
  c.fillStyle=dark;c.save();c.translate(hx-.06,hy-.07);c.rotate(.5+(mv?Math.sin(ph*2)*.15:0));c.beginPath();c.ellipse(0,.08,.07,.13,0,0,7);c.fill();c.restore();
  c.strokeStyle='#F36251';c.lineWidth=.05;c.beginPath();c.moveTo(.21,-.05+bob);c.lineTo(.25,.09+bob);c.stroke();
  if(mv){c.fillStyle='#F28B8B';c.beginPath();c.ellipse(hx+.2,hy+.14,.03,.05,0,0,7);c.fill()}
 }else{
  c.fillStyle='#F2A0A0';c.beginPath();c.arc(hx+.15,hy+.03,.025,0,7);c.fill();
  c.strokeStyle='#6a706e';c.lineWidth=.012;c.beginPath();c.moveTo(hx+.14,hy+.05);c.lineTo(hx+.29,hy+.01);c.moveTo(hx+.14,hy+.06);c.lineTo(hx+.28,hy+.09);c.stroke()}
 c.fillStyle='#fff';c.beginPath();c.arc(hx+.08,hy-.04,.045,0,7);c.fill();
 c.fillStyle='#111';c.beginPath();c.arc(hx+.095,hy-.04,.022,0,7);c.fill();
 c.restore()}
const MS=new WeakMap();
function drawMascots(ts){
 document.querySelectorAll('.mascot').forEach(cv=>{
  if(!cv.offsetParent||!cv.dataset.b)return;
  const w=cv.clientWidth,h=cv.clientHeight,d=Math.min(devicePixelRatio||1,2);
  if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
  let st=MS.get(cv);if(!st){st={ph:0,last:ts};MS.set(cv,st)}
  const dt=Math.min(.05,(ts-st.last)/1000);st.last=ts;
  const own=cv.closest('.bc'),hot=own&&own.matches(':hover,:focus-visible'),mode=cv.dataset.mode||'';
  const run=hot||mode==='jump'||mode==='run';
  if(run)st.ph+=dt*(hot?15:mode==='jump'?10:11);
  const s=Math.min(w/1.3,h/.98),jy=mode==='jump'?-Math.abs(Math.sin(st.ph*.7))*h*.16:0;
  drawPet(c,cv.dataset.b,w/2,h*.5+jy,s,1,st.ph,run,ts,mode==='sad'?.12:0)})}
function draw(ts){
 ctx.clearRect(0,0,W,H);
 ctx.drawImage(bgc,0,0,W,H);
 const by=ROWS*cs,zh=H-by,p=.5+.5*Math.sin(ts/400),pro=brand==='pro';
 const px=pro?W*.5:W*.4,py=by+zh*.52,gy=by+zh*.9;
 const g=ctx.createRadialGradient(px,py,6,px,py,zh*1.05);g.addColorStop(0,al(C.acc,.2+.08*p));g.addColorStop(1,al(C.acc,0));
 ctx.fillStyle=g;ctx.fillRect(4,by+4,W-8,zh-8);
 const q=cs*.22;for(let i=0;i<Math.ceil(W/q);i++){ctx.fillStyle=i%2?C.wall:'#fff';ctx.fillRect(i*q,by+2,q,q*.5)}
 const ax=W-cs*.5,ay=by-cs*.3+Math.sin(ts/260)*cs*.05;
 ctx.fillStyle=C.acc;ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(ax-cs*.14,ay-cs*.08);ctx.lineTo(ax+cs*.14,ay-cs*.08);ctx.lineTo(ax,ay+cs*.12);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
 const im=PIM[brand];
 if(im&&im.complete&&im.naturalWidth){
  const hh=zh*(pro?.8:.66),w=hh*im.naturalWidth/im.naturalHeight,bob=Math.sin(ts/600)*zh*.012;
  ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(px,gy+2,w*.5,zh*.04,0,0,7);ctx.fill();
  ctx.save();ctx.globalCompositeOperation='multiply';ctx.drawImage(im,px-w/2,gy-hh+bob,w,hh);ctx.restore();
  }
 const s0=start(),pp=(ts/1100)%1;
 ctx.fillStyle=al(C.acc,.1);ctx.beginPath();ctx.arc(s0[0],s0[1],cs*.42,0,7);ctx.fill();
 ctx.strokeStyle=al(C.acc,.6*(1-pp));ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(s0[0],s0[1],cs*(.3+.25*pp),0,7);ctx.stroke();
 const nowp=performance.now();paws=paws.filter(o=>nowp-o.t<2800);
 for(const o of paws)paw(ctx,o.x,o.y,o.a,cs*.2,pro?'#143248':'#404444',.55*(1-(nowp-o.t)/2800));
 ctx.globalAlpha=1;
 if(trail.length>1){ctx.lineCap=ctx.lineJoin='round';
  ctx.globalAlpha=.10;ctx.strokeStyle=C.acc;ctx.lineWidth=cs*.34;trailPath();
  ctx.globalAlpha=.4;ctx.lineWidth=cs*.12;trailPath();
  ctx.globalAlpha=.9;ctx.strokeStyle=C.acc2;ctx.lineWidth=cs*.04;trailPath();ctx.globalAlpha=1}
 sp=sp.filter(o=>o.l>0);for(const o of sp){o.x+=o.vx;o.y+=o.vy;o.l-=.04;ctx.globalAlpha=Math.max(0,o.l);ctx.fillStyle=C.acc2;ctx.beginPath();ctx.arc(o.x,o.y,Math.max(.1,o.r*o.l),0,7);ctx.fill()}ctx.globalAlpha=1;
 if(warm)phase+=Math.min(.05,(ts-(draw.p||ts))/1000)*13;draw.p=ts;const mv=warm||performance.now()-lastMove<140;
 if(hinting){ctx.strokeStyle=al(C.acc,.35+.35*p);ctx.lineWidth=3;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(head[0],head[1],cs*(.5+.04*p),0,7);ctx.stroke();ctx.setLineDash([])}
 drawPet(ctx,brand,head[0],head[1],cs*.74,face,phase,mv,ts,0)}
(function loop(ts){requestAnimationFrame(loop);try{drawMascots(ts)}catch(e){console.error(e)}if(onGame&&maze&&head){try{draw(ts)}catch(e){console.error(e)}}})();

async function startGame(){
 const my=++tok;running=false;done=false;clearInterval(timer);sp=[];
 maze=gen();face=1;phase=0;lastMove=0;hinting=true;fin=false;t1=0;paws=[];lastPaw=null;warm=true;$('hint').classList.remove('off');$('who').textContent=user.n;setT(LIMIT);$('pg').style.width='0';
 show('game');size();build();head=start();trail=[head];
 const c=$('cd3');c.classList.remove('off');
 for(const s of['3','2','1','Go!']){const t=$('cdt');t.textContent=s;sfx.cd(s);t.style.animation='none';void t.offsetWidth;t.style.animation='pop .6s cubic-bezier(.2,.8,.2,1) both';await new Promise(r=>setTimeout(r,650));if(my!==tok)return}
 c.classList.add('off');warm=false;
 running=true;t0=Date.now();
 timer=setInterval(()=>{const left=Math.max(0,LIMIT-(Date.now()-t0)/1000);setT(left);if(left<=0)end(false)},250)}
function setT(l){const c_=Math.ceil(l);if(c_!==setT.c){if(c_<=5&&c_>0&&running)sfx.tick(c_);setT.c=c_}$('tm').textContent=Math.ceil(l);$('tr').classList.toggle('low',l<=8);$('fg').style.strokeDashoffset=169.6*(1-l/LIMIT)}
function end(won){
 if(done)return;done=true;running=false;drawing=false;cv.classList.remove('drag');clearInterval(timer);
 if(won){const secs=((t1||Date.now())-t0)/1000,B=BR[brand];
  $('wt').textContent='You made it, '+user.n.split(' ')[0]+'!';
  $('ws').textContent=B.prize+' is yours. Show this code to our team to claim it.';
  $('cd').textContent=B.pre+'-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+(Date.now()%10000);
  $('prodW').src=PROD[brand];$('st').textContent='Finished in '+secs.toFixed(1)+' seconds.';
  navigator.vibrate&&navigator.vibrate(200);sfx.win();show('win');confetti()}
 else{sfx.lose();show('lose')}}

function paw(c,x,y,a,sz,col,al_){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.globalAlpha=al_;
 c.beginPath();c.ellipse(0,sz*.15,sz*.34,sz*.28,0,0,7);c.fill();
 for(const[dx,dy]of[[-.32,-.22],[-.11,-.42],[.11,-.42],[.32,-.22]]){c.beginPath();c.ellipse(dx*sz,dy*sz,sz*.11,sz*.15,0,0,7);c.fill()}
 c.restore()}
function finishRun(){
 if(fin||done)return;fin=true;running=false;drawing=false;cv.classList.remove('drag');clearInterval(timer);t1=Date.now();
 const my=tok,by=ROWS*cs,zh=H-by,pro=brand==='pro',im=PIM[brand],ratio=im&&im.naturalWidth?im.naturalWidth/im.naturalHeight:1.3;
 const px=pro?W*.5:W*.4,pw=zh*(pro?.8:.66)*ratio;
 const tx=px+pw/2+cs*.55,ty=by+zh*.9-cs*.3;
 const x0=head[0],y0=head[1],dist=Math.hypot(tx-x0,ty-y0),dur=Math.max(700,dist/(cs*4.2)*1000),s0=performance.now();
 face=tx<x0?-1:1;
 (function step(now){
  if(my!==tok)return;
  const k=Math.min(1,(now-s0)/dur),e=k*k*(3-2*k);
  head=[x0+(tx-x0)*e,y0+(ty-y0)*e];phase+=.5;lastMove=performance.now();
  if(sp.length<40&&Math.random()<.7)sp.push({x:head[0]-face*cs*.3,y:head[1]+cs*.25,vx:-face*.5,vy:-Math.random()*.5,r:cs*.06,l:1});
  if(k<1)return requestAnimationFrame(step);
  face=-1;const h0=performance.now();
  (function hop(n){
   if(my!==tok)return;
   const j=Math.min(1,(n-h0)/800);
   head=[tx,ty-Math.abs(Math.sin(j*Math.PI*2))*cs*.5];phase+=.3;lastMove=performance.now();
   if(j<1)requestAnimationFrame(hop);else{head=[tx,ty];end(true)}
  })(h0);
 })(s0);
}
function pos(e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*(W/b.width),(e.clientY-b.top)*(H/b.height)]}
function pen(tx,ty){
 let[x,y]=head;const d=Math.hypot(tx-x,ty-y),n=Math.max(1,Math.ceil(d/(cs*.08))),dx=(tx-x)/n,dy=(ty-y)/n;
 for(let i=0;i<n;i++){if(free(x+dx,y+dy)){x+=dx;y+=dy}else if(free(x+dx,y))x+=dx;else if(free(x,y+dy))y+=dy;else break}
 if(Math.hypot(tx-x,ty-y)>cs*.12)sfx.bump();
 if(Math.hypot(x-head[0],y-head[1])>2&&sp.length<40)sp.push({x,y,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,r:cs*.07,l:1});
 const mdx=x-head[0],md=Math.hypot(mdx,y-head[1]);if(Math.abs(mdx)>.3)face=mdx>0?1:-1;if(md>.2){phase+=md/(cs*.11);lastMove=performance.now();if(hinting){hinting=false;$('hint').classList.add('off')}}
 if(md>.2){if(!lastPaw)lastPaw=[head[0],head[1]];const pd=Math.hypot(x-lastPaw[0],y-lastPaw[1]);if(pd>cs*.34){const ang=Math.atan2(y-lastPaw[1],x-lastPaw[0]);pawSide*=-1;sfx.step();paws.push({x:x-Math.sin(ang)*pawSide*cs*.09,y:y+Math.cos(ang)*pawSide*cs*.09,a:ang+Math.PI/2,t:performance.now()});if(paws.length>70)paws.shift();lastPaw=[x,y]}}
 head=[x,y];const l=trail[trail.length-1];
 if(Math.hypot(x-l[0],y-l[1])>cs*.14){trail.push(head);if(trail.length>500){trail=trail.filter((_,i)=>i%2===0||i>trail.length-120)}}
 const g=goalPt(),s=start(),tot=Math.hypot(g[0]-s[0],g[1]-s[1]);
 $('pg').style.width=Math.max(0,Math.min(100,100*(1-Math.hypot(x-g[0],y-g[1])/tot)))+'%';
 if(y>ROWS*cs+cs*.55)finishRun()}
cv.addEventListener('pointerdown',e=>{if(!running)return;const[x,y]=pos(e);
 if(Math.hypot(x-head[0],y-head[1])<cs*1.1){drawing=true;cv.classList.add('drag');cv.setPointerCapture(e.pointerId);pen(x,y)}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!drawing||!running)return;try{const[x,y]=pos(e);pen(x,y)}catch(err){console.error(err)}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drawing=false;cv.classList.remove('drag')}));
addEventListener('resize',()=>{if(onGame&&maze&&running){size();build();head=start();trail=[head]}});

function confetti(){const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=[C.acc,C.acc2,'#c9c7bf'],P=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,s:4+Math.random()*7,c:cols[Math.random()*3|0],r:Math.random()*6,w:Math.random()*.2-.1}));
 let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30)*1.5;p.r+=p.w;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(++f<200)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

const h=location.hash.slice(1);if(BR[h]){setBrand(h);show('intro')}
if(h==='admin')adminPanel();
